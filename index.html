<!-- Caminho: index.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grupo Caetano Apps</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/custom.css">
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased select-none">

    <!-- Cabeçalho Principal da Portaria -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 text-white font-bold p-2 rounded-lg text-lg tracking-wider">GC</div>
            <div>
                <h1 class="font-bold text-base md:text-lg leading-tight">Grupo Caetano</h1>
                <p id="condominio-ativo-nome" class="text-xs text-slate-400 font-medium">Selecione o Condomínio</p>
            </div>
        </div>
        <div id="status-conexao" class="flex items-center space-x-2 bg-emerald-950 text-emerald-400 text-xs px-2.5 py-1 rounded-full border border-emerald-800">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="label-online">ONLINE</span>
        </div>
    </header>

    <!-- Conteúdo Dinâmico da Aplicação -->
    <main id="app-view" class="flex-1 p-3 md:p-6 max-w-5xl w-full mx-auto">
        <!-- O conteúdo das telas será injetado dinamicamente via JS -->
        <div class="flex flex-col items-center justify-center min-h-[60vh] text-slate-400">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500 mb-4"></div>
            <p class="text-sm font-semibold">Carregando Sistema de Portaria...</p>
        </div>
    </main>

    <!-- Rodapé Operacional / Menu Inferior de Rápido Acesso -->
    <nav id="nav-principal" class="hidden bg-slate-800 border-t border-slate-700 grid grid-cols-5 text-center text-xs p-1">
        <button id="btn-nav-m3" class="p-2 flex flex-col items-center justify-center min-h-[48px] text-slate-300 hover:text-white active:bg-slate-700 rounded-lg">
            <span class="text-xl">📦</span>
            <span class="text-[10px] mt-0.5">Encomendas</span>
        </button>
        <button id="btn-nav-m4" class="p-2 flex flex-col items-center justify-center min-h-[48px] text-slate-300 hover:text-white active:bg-slate-700 rounded-lg">
            <span class="text-xl">🔑</span>
            <span class="text-[10px] mt-0.5">Chaves</span>
        </button>
        <button id="btn-nav-m5" class="p-2 flex flex-col items-center justify-center min-h-[48px] text-slate-300 hover:text-white active:bg-slate-700 rounded-lg">
            <span class="text-xl">🧳</span>
            <span class="text-[10px] mt-0.5">Custódia</span>
        </button>
        <button id="btn-nav-m6" class="p-2 flex flex-col items-center justify-center min-h-[48px] text-slate-300 hover:text-white active:bg-slate-700 rounded-lg">
            <span class="text-xl">🪪</span>
            <span class="text-[10px] mt-0.5">Autorizados</span>
        </button>
        <button id="btn-nav-menu" class="p-2 flex flex-col items-center justify-center min-h-[48px] text-slate-300 hover:text-white active:bg-slate-700 rounded-lg">
            <span class="text-xl">☰</span>
            <span class="text-[10px] mt-0.5">Mais</span>
        </button>
    </nav>

    <!-- Modal Global de Fallback do WhatsApp -->
    <div id="modal-whatsapp-fallback" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-5 text-slate-100 shadow-2xl">
            <h3 class="text-lg font-bold text-emerald-400 mb-2 flex items-center gap-2">
                <span>💬</span> Mensagem Gerada com Sucesso
            </h3>
            <p class="text-xs text-slate-300 mb-4">
                Se a janela do WhatsApp não abrir automaticamente no tablet da portaria, use os botões abaixo:
            </p>
            <textarea id="txt-whatsapp-mensagem" readonly class="w-full h-32 bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs text-slate-200 font-mono mb-4 resize-none focus:outline-none"></textarea>
            <div class="flex flex-col gap-2">
                <a id="btn-abrir-wa-link" href="#" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 text-center rounded-xl min-h-[48px] flex items-center justify-center gap-2 text-sm shadow-lg">
                    <span>🚀</span> Abrir no WhatsApp
                </a>
                <button id="btn-copiar-wa-msg" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold py-3 rounded-xl min-h-[48px] text-sm flex items-center justify-center gap-2">
                    <span>📋</span> Copiar Mensagem
                </button>
                <button id="btn-fechar-wa-modal" class="w-full bg-transparent hover:bg-slate-700 text-slate-400 font-medium py-2 rounded-xl text-xs">
                    Fechar
                </button>
            </div>
        </div>
    </div>

    <!-- Script de Inicialização da Aplicação -->
    <script type="module" src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        }
    </script>
</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Caminho: index.html -->
<script type="module" src="js/app.js"></script>
